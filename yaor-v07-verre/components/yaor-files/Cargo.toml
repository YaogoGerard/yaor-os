# yaor-files — gestionnaire de fichiers du bureau YAOR (v0.6 étape 7).
#
# Membre du workspace des composants internes (components/), bâti avec la
# toolchain Rust de l'hôte dans le chroot (ADR-019). Client xdg-shell
# régulier (fenêtre flottante décorée par le SSD du compositor) rendu
# wl_shm — même socle que yaor-term (sctk). Listing std::fs du répertoire
# courant, clic navigation dossiers, lecture texte lecture seule.
#
# Journal : stderr préfixé « yaor-files: » (jetons QA courts).
[package]
name = "yaor-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Client toolkit épinglé : version vendue dans l'arbre Smithay 0.7.0 («
# un besoin = un fournisseur ») — pas de dépendance xkbcommon directe
# (aucune frappe clavier en v0.6, tout se joue au pointeur).
[dependencies.smithay-client-toolkit]
version = "0.19.2"

[dependencies.wayland-client]
version = "0.31"

# clock_gettime/poll pour le journal d'uptime (convention commune).
[dependencies.libc]
version = "0.2"

# Configuration du bureau (thème + palette) — même source que le bureau.
[dependencies.yaor-config]
path = "../yaor-config"

# Police réelle + primitives de rendu (étape 1).
[dependencies.yaor-ui]
path = "../yaor-ui"
