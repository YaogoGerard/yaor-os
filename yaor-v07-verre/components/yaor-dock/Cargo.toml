# yaor-dock — dock du profil macOS-like (jalon v0.6 « Caméléon », étape 2).
#
# Membre du workspace des composants internes (components/) — client
# layer-shell dédié, comme le panel : décision d'ouverture du jalon v0.6
# (barre/dock/panneau = clients séparés, jamais dans le compositor). Le dock
# s'ancre en bas et se centre, sans zone exclusive, donc les fenêtres
# gardent tout l'écran (comportement macOS-like).
#
# Dépendances externes : arbre vendu de Smithay 0.7.0 (ADR-018), comme
# yaor-panel — la config components/.cargo/config.toml remplace crates.io
# par le dossier vendored, aucune résolution réseau.
[package]
name = "yaor-dock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Client toolkit épinglé : la version vendue dans l'arbre Smithay 0.7.0
# (son Cargo.lock l'épingle à 0.19.2 — « un besoin = un fournisseur »).
[dependencies.smithay-client-toolkit]
version = "0.19.2"

# Types wayland directs (Connection, protocoles) — réexportés par sctk ;
# dépendance explicite pour la lisibilité des imports (0.31 vendu).
[dependencies.wayland-client]
version = "0.31"

# Protocole wlr-foreign-toplevel-management (étape 2) : le dock liste les
# fenêtres et les active comme la taskbar du profil classique. Version
# vendue dans l'arbre Smithay (ADR-018).
[dependencies.wayland-protocols-wlr]
version = "0.3.12"
features = ["client"]

# Thème et géométrie du dock ([theme], [dock] de desktop.toml) — même
# crate que le compositor et le panel, aucun format dupliqué.
[dependencies.yaor-config]
path = "../yaor-config"

# Emblème de la tuile de lancement (`logo.path`) : décodage PNG/JPEG par
# la crate `image` vendue dans l'arbre Smithay (ADR-018).
[dependencies.yaor-assets]
path = "../yaor-assets"

# Primitives de rendu partagées avec le panel (étape 2) : canvas Argb8888,
# formes anti-aliasées, police bitmap et thème.
[dependencies.yaor-ui]
path = "../yaor-ui"
