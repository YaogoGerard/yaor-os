# yaor-ctl — commande de contrôle du bureau YAOR (v0.6 étape 3).
#
# Membre du workspace des composants internes (components/). Client
# wayland minimal (pas de toolkit ni de rendu) : parle le protocole
# privé yaor_workspace_v1 (crate yaor-protocol du workspace, codegen
# wayland-scanner vendu — ADR-018).
#
# Usage :
#   yaor-ctl workspace        — affiche l'espace actif (1-5)
#   yaor-ctl workspace N      — bascule vers l'espace N (1-5)
#   yaor-ctl send N           — envoie la fenêtre focusée à l'espace N
#
# Hors profil tiling, le compositor ignore les requêtes (no-op) —
# mêmes gardes que les raccourcis clavier.
[package]
name = "yaor-ctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Types wayland directs (Connection, registre, dispatch) — version
# épinglée par le Cargo.lock de l'arbre Smithay (ADR-018).
[dependencies.wayland-client]
version = "0.31"

[dependencies.yaor-protocol]
path = "../yaor-protocol"
