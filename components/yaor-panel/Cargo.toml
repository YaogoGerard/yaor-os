# yaor-panel — panneau du bureau YAOR (jalon v0.6 « Caméléon », étape 1).
#
# Membre du workspace des composants internes (components/), bâti avec la
# toolchain Rust de l'hôte dans le chroot (ADR-019). Premier client
# layer-shell du système : barre supérieure ancrée avec zone exclusive
# (zwlr_layer_shell_v1 via smithay-client-toolkit). Les dépendances
# externes résident dans l'arbre vendu de Smithay 0.7.0 (ADR-018) —
# la config components/.cargo/config.toml remplace crates.io par le
# dossier vendored, donc aucune résolution réseau.
[package]
name = "yaor-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Client toolkit épinglé : la version vendue dans l'arbre Smithay 0.7.0
# (son Cargo.lock l'épingle à 0.19.2 — « un besoin = un fournisseur »).
[dependencies.smithay-client-toolkit]
version = "0.19.2"

# Types wayland directs (Connection, protocoles) — réexportés par sctk ;
# dépendance explicite pour la lisibilité des imports (0.31 vendu).
[dependencies.wayland-client]
version = "0.31"

# Protocole wlr-foreign-toplevel-management (jalon 1b.c — taskbar) :
# code généré client (le compositor publie les fenêtres, le panel
# active/minimise). Version vendue dans l'arbre Smithay (ADR-018).
[dependencies.wayland-protocols-wlr]
version = "0.3.12"
features = ["client"]

# Protocoles privés du bureau (étape 3) : yaor_workspace_v1 — indicateurs
# d'espaces de la barre (profil tiling). Code client ; crate maison du
# workspace, codegen wayland-scanner vendu (ADR-018).
[dependencies.yaor-protocol]
path = "../yaor-protocol"

# Assets du bureau (1e) : fond d'écran + emblème — PNG/JPEG décodés
# par la crate `image` vendue dans l'arbre Smithay (ADR-018).
[dependencies.yaor-assets]
path = "../yaor-assets"

# Configuration du bureau (1e.logo) : `logo.path` vient de
# `desktop.toml` — même source que le compositor (v0.5, REQ-SW-015),
# donc même crate, aucun format dupliqué.
[dependencies.yaor-config]
path = "../yaor-config"

# Primitives de rendu partagées (étape 2) : canvas Argb8888, formes
# anti-aliasées, police bitmap 5x7 et thème — mêmes fonctions pour le
# panel et le dock, un seul fournisseur (extraction depuis ce crate).
[dependencies.yaor-ui]
path = "../yaor-ui"
