<?xml version="1.0" encoding="UTF-8"?>
<!-- Maquette — profil classique (jalon v0.6 Caméléon, cible REQ-SW-008
     « de type Windows-like »). Cible de l'étape 1b : taskbar BASSE +
     fenêtres flottantes avec décorations serveur. L'état livré de
     l'étape 1 (barre haute + tiling) est un état intermédiaire.
     Identité « ambre sur noir » d'après docs/05-ui-ux/branding/.
     Palette : voir docs/05-ui-ux/branding/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="canyon" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7A3E10"/>
      <stop offset="0.55" stop-color="#E8862E"/>
      <stop offset="1" stop-color="#FFB259"/>
    </linearGradient>
    <linearGradient id="fenetre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A20"/>
      <stop offset="1" stop-color="#14141A"/>
    </linearGradient>
    <linearGradient id="taskbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141A"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
  </defs>

  <!-- Fond de bureau -->
  <rect width="1280" height="800" fill="#16161C"/>

  <!-- ============ Fenêtres FLOTTANTES (étape 1b — décorations serveur) -->
  <!-- W2 : fenêtre focus (liseré ambre) -->
  <rect x="520" y="180" width="560" height="380" rx="8" fill="url(#fenetre)" stroke="#E8862E" stroke-width="2"/>
  <rect x="520" y="180" width="560" height="26" rx="8" fill="#1E1E26"/>
  <text x="536" y="198" font-family="monospace" font-size="12" fill="#F2E8DC">waytest — W2 (focus)</text>
  <!-- boutons de la barre de titre (decorations serveur) -->
  <rect x="1018" y="184" width="18" height="18" rx="4" fill="#2C2C34"/>
  <rect x="1042" y="184" width="18" height="18" rx="4" fill="#2C2C34"/>
  <rect x="1066" y="184" width="18" height="18" rx="4" fill="#E8862E"/>
  <rect x="532" y="212" width="536" height="336" fill="#101014"/>
  <text x="552" y="236" font-family="monospace" font-size="12" fill="#6C6C78">zone client — redimensionnable par les bords</text>

  <!-- W1 : fenêtre arrière (pas de focus, liseré sombre) -->
  <rect x="120" y="120" width="480" height="340" rx="8" fill="url(#fenetre)" stroke="#2C2C34" stroke-width="2"/>
  <rect x="120" y="120" width="480" height="26" rx="8" fill="#1A1A20"/>
  <text x="136" y="138" font-family="monospace" font-size="12" fill="#8C8C98">waytest — W1</text>
  <rect x="132" y="152" width="456" height="296" fill="#101014"/>

  <!-- W3 : Xwayland (bleu) -->
  <rect x="240" y="420" width="420" height="290" rx="8" fill="url(#fenetre)" stroke="#3C3C44" stroke-width="2"/>
  <rect x="240" y="420" width="420" height="26" rx="8" fill="#1E1E26"/>
  <text x="256" y="438" font-family="monospace" font-size="12" fill="#F2E8DC">xwtest — W3 (Xwayland)</text>
  <rect x="252" y="452" width="396" height="246" fill="#2A6ADB"/>

  <!-- ============ Taskbar (couche Top ancrée BAS, zone exclusive 24 px) -->
  <rect x="0" y="776" width="1280" height="24" fill="url(#taskbar)"/>

  <!-- Bouton Démarrer (YAOR) à gauche -->
  <g transform="translate(4,776)">
    <rect x="0" y="4" width="60" height="16" rx="2" fill="#E8862E"/>
    <text x="13" y="16" font-family="monospace" font-size="10" font-weight="bold" fill="#101014">YAOR</text>
  </g>
  <!-- liste des fenêtres ouvertes (taskbar buttons) -->
  <rect x="74" y="780" width="120" height="16" rx="3" fill="#1E1E26" stroke="#E8862E"/>
  <text x="84" y="792" font-family="monospace" font-size="10" fill="#F2E8DC">W1 waytest</text>
  <rect x="200" y="780" width="120" height="16" rx="3" fill="#1E1E26" stroke="#E8862E"/>
  <text x="210" y="792" font-family="monospace" font-size="10" fill="#F2E8DC">W2 waytest</text>
  <rect x="326" y="780" width="120" height="16" rx="3" fill="#1E1E26" stroke="#5A5A64"/>
  <text x="336" y="792" font-family="monospace" font-size="10" fill="#8C8C98">W3 xwtest</text>
  <!-- horloge à droite -->
  <text x="1274" y="792" text-anchor="end" font-family="monospace" font-size="10" fill="#F2E8DC">12:34</text>

  <!-- ============ Menu Démarrer ouvert (au-dessus du bouton) -->
  <rect x="4" y="716" width="140" height="56" fill="#101014" stroke="#B96A1F"/>
  <rect x="4" y="720" width="132" height="22" fill="#1A1A20"/>
  <text x="14" y="735" font-family="monospace" font-size="11" fill="#F2E8DC">WAYTEST</text>
  <rect x="4" y="744" width="132" height="22" fill="#101014"/>
  <text x="14" y="759" font-family="monospace" font-size="11" fill="#F2E8DC">XWTEST</text>

  <!-- ============ Annotations de conception (hors produit) -->
  <g font-family="monospace" font-size="11" fill="#8C8C98">
    <text x="1000" y="40">taskbar Bottom, zone exclusive</text>
    <text x="1000" y="56">fenetres flottantes + decorations serveur</text>
    <text x="1000" y="72">menu Demarrer ouvert vers le haut</text>
    <text x="1000" y="88">liseré ambre = focus</text>
  </g>
  <line x1="996" y1="36" x2="1104" y2="764" stroke="#8C8C98" stroke-width="1"/>
  <line x1="996" y1="52" x2="1082" y2="186" stroke="#8C8C98" stroke-width="1"/>
</svg>
