# YAOR — partition de données persistantes /var.
#
# « Type=var » (UAPI.2 Discoverable Partitions Specification) : elle survit aux
# mises à jour et aux retours arrière, qui ne touchent que les slots racine
# (REQ-SW-026). Définie en dernier : elle prend tout l'espace restant du disque.
[Partition]
Type=var
Label=yaor-var
Format=ext4
SizeMinBytes=1G
