# YAOR — slot racine A (l'un des deux slots A/B, ADR-015, REQ-SW-026).
#
# Vide au départ : l'étiquette « _empty » signale à systemd-sysupdate une
# partition libre où écrire une image du système (il la réétiquette ensuite
# selon la version, « yaor-root_<v> »). Aucun système de fichiers n'est créé
# ici : l'image racine est écrite telle quelle par systemd-sysupdate.
#
# NoAuto=1 (attribut GPT « NoAuto ») : les deux slots racine partagent le même
# type « root-x86-64 » ; cet attribut évite que systemd-gpt-auto-generator
# tente de les traiter automatiquement (ambiguïté), le démarrage se faisant par
# « root= » explicite côté Limine. Identique au slot B (40-root-b.conf).
[Partition]
Type=root-x86-64
Label=_empty
NoAuto=1
SizeMinBytes=2G
SizeMaxBytes=2G
