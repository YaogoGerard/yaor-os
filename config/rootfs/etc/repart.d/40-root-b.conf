# YAOR — slot racine B (second slot A/B). Voir 30-root-a.conf : les deux
# définitions sont volontairement identiques (mêmes Type/Taille), ce qui crée
# deux partitions « root-x86-64 » sur le disque et réalise l'alternance A/B.
[Partition]
Type=root-x86-64
Label=_empty
NoAuto=1
SizeMinBytes=2G
SizeMaxBytes=2G
