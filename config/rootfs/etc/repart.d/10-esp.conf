# YAOR — ESP (EFI System Partition).
#
# Limine (UEFI via EFI/BOOT/BOOTX64.EFI ; BIOS via la partition « BIOS boot »),
# les noyaux, les initramfs, limine.conf et l'état des slots A/B vivent ici.
# Créée par systemd-repart (ADR-015) ; l'opération est idempotente.
[Partition]
Type=esp
Label=yaor-esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
