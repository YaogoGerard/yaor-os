# YAOR — partition « BIOS boot » (seconde étape de Limine en BIOS sur GPT).
#
# systemd n'attribue pas d'identifiant symbolique à ce type : on donne l'UUID
# littéral de la « BIOS boot partition » (le même que GRUB), que Limine
# bios-install recherche. Taille : 1 Mio (le minimum utile est de 32 Kio).
[Partition]
Type=21686148-6449-6e6f-744e-656564454649
SizeMinBytes=1M
SizeMaxBytes=1M
