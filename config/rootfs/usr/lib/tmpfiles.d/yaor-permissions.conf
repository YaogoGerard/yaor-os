# YAOR — permissions du « dbus-daemon-launch-helper ».
#
# D-Bus exige l'auxiliaire d'activation en root:messagebus avec le bit
# setgid (mode 4750). Le build sans privilèges réels ne peut pas chowner
# vers un gid non mappé (espace d'utilisateurs du build, ADR-001) : la
# règle « z » ci-dessous rétablit le propriétaire et le mode après
# l'installation, à chaque démarrage (le vrai root a alors tous les gid).
z /usr/libexec/dbus-daemon-launch-helper 4750 root messagebus -
